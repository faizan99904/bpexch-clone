<div class=" flex flex-col items-center p-4 w-full">
    <!-- Customer Support Section -->
    <div class="w-full  bg-white shadow rounded-md mb-6 ">
        <div class="bg-[rgb(240,243,245)] text-black font-semibold px-4 py-2 rounded-t-md">
            Customer Support
        </div>
        <form class="p-4" [formGroup]="socialForm" (ngSubmit)="onSubmit()">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Type Dropdown -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                    <select
                        class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        formControlName="type">
                        <option selected>whatsapp</option>
                        <option>telegram</option>
                        <option>calling</option>
                        <option>mobile</option>
                        <option>facebook</option>
                        <option>instagram</option>
                    </select>
                </div>

                <!-- Link Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Link</label>
                    <input type="text" placeholder="Link" formControlName="link"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>

                <!-- Save Button -->
                <div class="flex items-end">
                    <button type="submit" [disabled]="socialForm.invalid"
                        [ngClass]="{'opacity-[.5]':socialForm.invalid}"
                        class="w-full md:w-auto bg-gray-600 text-white px-5 py-2 rounded-md hover:bg-gray-700 transition">
                        💾 Save
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Current Customer Support Details -->
    <div class="w-full  bg-white shadow rounded-md">
        <div class="bg-[rgb(240,243,245)] text-black font-semibold px-4 py-2 rounded-t-md">
            Current Cust.Sup. Details
        </div>
        <div class="overflow-x-auto px-3 py-5">
            <table class="w-full text-sm text-left border border-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-4 py-2 border-b font-semibold">Type</th>
                        <th class="px-4 py-2 border-b font-semibold">Link</th>
                        <th class="px-4 py-2 border-b font-semibold">Action</th>
                    </tr>
                </thead>
                <tbody>
                    @if(this.getSupportList.length == 0 ){
                    <tr>
                        <td colspan="3" class="text-center py-4 text-gray-500">
                            No Record Found...
                        </td>
                    </tr>
                    }@else {
                    <tr *ngFor="let item of getSupportList" class="border-b">
                        <td class="text-center py-4 text-gray-500">
                            {{item.type}}
                        </td>
                        <td class="text-center py-4 text-gray-500">
                            {{item.link}}
                        </td>
                        <td class="text-center py-4 text-gray-500">
                            <div class="flex justify-center items-center gap-2">
                                <button class="relative group edit-btn" type="button" (click)="openEditModal(item)">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="relative group delete-btn" type="button" (click)="onDelete(item)">
                                    <i class="fas fa-trash"></i>

                                </button>
                            </div>
                        </td>
                    </tr>
                    }

                </tbody>
            </table>
        </div>
    </div>
</div>




<!-- edit-support-modal.component.html -->
<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" *ngIf="isEditModalOpen"
    (click)="closeEditModal()">
    <div class="bg-white w-full max-w-md rounded-lg shadow-lg overflow-hidden" (click)="$event.stopPropagation()">
        <div class="px-4 py-3 border-b">
            <h3 class="text-lg font-semibold">Edit Customer Support</h3>
        </div>

        <form [formGroup]="socialForm" (ngSubmit)="onUpdate()" class="p-4 space-y-4">
            <!-- Type -->
            <div>
                <label class="block mb-1 font-medium">Type</label>
                <select formControlName="type" class="w-full border rounded p-2">
                    <option value="">Select Type</option>
                    <option value="whatsapp">Whatsapp</option>
                    <option value="telegram">Telegram</option>
                    <option value="livechat">Live Chat</option>
                </select>
                <div *ngIf="socialForm.get('type')?.touched && socialForm.get('type')?.invalid"
                    class="text-red-500 text-sm">
                    Type is required.
                </div>
            </div>

            <!-- Link -->
            <div>
                <label class="block mb-1 font-medium">Link</label>
                <input type="url" formControlName="link" placeholder="https://example.com/support"
                    class="w-full border rounded p-2" />
                <div *ngIf="socialForm.get('link')?.touched && socialForm.get('link')?.invalid"
                    class="text-red-500 text-sm">
                    Valid URL is required.
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" (click)="closeEditModal()"
                    class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                    Cancel
                </button>
                <button type="submit" [disabled]="socialForm.invalid"
                    class="bg-[#00b181] text-white px-4 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
