<section class="overflow-y-auto overflow-x-auto h-[85vh]">
  <div class="main-container">
    <div class="table-container">
      <table class="min-w-full divide-y divide-gray-200">
        <thead>
        <tr>
          <th scope="col" class="table-header">ID</th>
          <th scope="col" class="table-header">Username</th>
          <th scope="col" class="table-header">Name</th>
          <th scope="col" class="table-header">Role</th>
          <th scope="col" class="table-header">IsDemo</th>
          <th scope="col" class="table-header">Actions</th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <!-- Table rows -->
        <tr *ngFor="let user of deletedUsers; let i = index">
          <td class="table-cell">{{ i + 1 }}</td>
          <td class="table-cell">{{ user.username }}</td>
          <td class="table-cell">{{ user.name }}</td>
          <td class="table-cell">{{ user.role }}</td>
          <td class="table-cell">
  <span class="status-badge" [ngClass]="user.isDemo === 'true' ? 'status-active' : 'status-inactive'">
    {{ user.isDemo === 'true' ? 'Yes' : 'No' }}
  </span>
          </td>
          <td class="table-cell">
            <button class="bg-[#00b181] rounded text-white px-3 py-1.5" (click)="restoreUser(user._id)">Restore</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
