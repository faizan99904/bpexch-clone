<!-- layout.component.html -->
<div class="flex flex-col h-screen overflow-x-hidden bg-[#E4E5E6]">
    <app-header></app-header>
    <div class=" flex flex-row h-[calc(100vh-55px)] mt-[55px] w-full">
        <div >
            <app-sidebar></app-sidebar>
        </div>
        <div class="w-full">
            <main class="py-2.5 px-[5px] h-full" [ngClass]="{
                
            'md:ml-[200px] lg:duration-200 lg:transition-all' : isOpen,
            'md:!ml-[0px] lg:duration-200 lg:transition-all' : !isOpen,
            'md:ml-[50px] lg:duration-200 lg:transition-all' : slimSidebar
        }">
                <router-outlet></router-outlet>
                <app-footer></app-footer>
            </main>
        </div>
    </div>
