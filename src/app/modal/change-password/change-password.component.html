<div class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-50 z-50">
  <div class="bg-white rounded-lg shadow-lg w-11/12 md:w-2/3 lg:w-1/2">
    <div class="flex items-center justify-between p-4 border-b">
      <h5 class="text-lg font-semibold">Change Password</h5>
      <button type="button" class="text-gray-500 hover:text-gray-700 text-2xl" (click)="onClose()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="p-6">
      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
          <div class="relative">
            <input [type]="showCurrentPassword ? 'text' : 'password'" id="currentPassword"
              formControlName="currentPassword"
              class="form-input w-full border border-gray-300 px-3 py-2 rounded pr-10"
              placeholder="Enter current password" />
            <button type="button" class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500"
              (click)="toggleCurrentPassword()">
              <svg *ngIf="!showCurrentPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 12s3.7-6.5 9.5-6.5S21.5 12 21.5 12s-3.7 6.5-9.5 6.5S2.5 12 2.5 12z" />
                <circle cx="12" cy="12" r="3.25" />
              </svg>
              <svg *ngIf="showCurrentPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.2 6.2C2.8 7.6 1.7 9.3 1 12c1.9 4 5.7 6.5 11 6.5 1.8 0 3.4-.3 4.9-.9" />
                <path d="M9.5 9.5a3.5 3.5 0 0 0 5 5" />
                <path d="M3 3l18 18" />
                <path d="M10.2 5.7c.6-.1 1.2-.2 1.8-.2 5.3 0 9.1 2.5 11 6.5-.7 1.5-1.6 2.8-2.7 3.9" />
              </svg>
            </button>
          </div>
          <div *ngIf="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched"
            class="text-red-600">
            <small *ngIf="changePasswordForm.get('currentPassword')?.errors?.['required']">Current password is
              required.</small>
            <small *ngIf="changePasswordForm.get('currentPassword')?.errors?.['minlength']">Current password must be at
              least 8 characters long.</small>
          </div>
        </div>
        <div class="mb-4">
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <div class="relative">
            <input [type]="showNewPassword ? 'text' : 'password'" id="newPassword" formControlName="newPassword"
              class="form-input w-full border border-gray-300 px-3 py-2 rounded pr-10"
              placeholder="Enter new password" />
            <button type="button" class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500"
              (click)="toggleNewPassword()">
              <svg *ngIf="!showNewPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 12s3.7-6.5 9.5-6.5S21.5 12 21.5 12s-3.7 6.5-9.5 6.5S2.5 12 2.5 12z" />
                <circle cx="12" cy="12" r="3.25" />
              </svg>
              <svg *ngIf="showNewPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.2 6.2C2.8 7.6 1.7 9.3 1 12c1.9 4 5.7 6.5 11 6.5 1.8 0 3.4-.3 4.9-.9" />
                <path d="M9.5 9.5a3.5 3.5 0 0 0 5 5" />
                <path d="M3 3l18 18" />
                <path d="M10.2 5.7c.6-.1 1.2-.2 1.8-.2 5.3 0 9.1 2.5 11 6.5-.7 1.5-1.6 2.8-2.7 3.9" />
              </svg>
            </button>
          </div>
          <div *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched"
            class="text-red-600">
            <small *ngIf="changePasswordForm.get('newPassword')?.errors?.['required']">New password is required.</small>
            <small *ngIf="changePasswordForm.get('newPassword')?.errors?.['minlength']">New password must be at least 8
              characters long.</small>
          </div>
        </div>
      </form>
    </div>
    <div class="flex items-center justify-end p-4 border-t">
      <button type="button" class="bg-red-500 text-white px-4 py-2 rounded-lg mr-2" (click)="onClose()">
        Cancel
      </button>
      <button type="submit" class="bg-[#00b181] text-white px-4 py-2 rounded-lg" (click)="onSubmit()"
        [disabled]="changePasswordForm.invalid || isSubmitting">
        <span *ngIf="isSubmitting"
          class="mr-2 inline-block h-5 w-5 animate-spin rounded-full border-4 border-white border-t-transparent"></span>
        Update Password
      </button>
    </div>
  </div>
</div>
